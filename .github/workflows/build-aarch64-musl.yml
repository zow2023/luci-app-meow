name: Build meow aarch64-unknown-linux-musl

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build aarch64-unknown-linux-musl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream meow-rs
        uses: actions/checkout@v5
        with:
          repository: meow-rs/meow-rs
          ref: main
          path: meow-rs
          fetch-depth: 1

      - name: Setup Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 \
            --profile minimal \
            --no-self-update

          rustup target add \
            --toolchain 1.98.1 \
            aarch64-unknown-linux-musl

      - name: Verify Rust target
        shell: bash
        run: |
          rustc +1.98.1 --version
          rustc +1.98.1 --print target-libdir \
            --target aarch64-unknown-linux-musl

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.98.1 install --locked cargo-zigbuild

      - name: Build release binary
        working-directory: meow-rs
        shell: bash
        run: |
          cargo +1.98.1 zigbuild \
            --release \
            --locked \
            --target aarch64-unknown-linux-musl \
            --bin meow

      - name: Prepare artifact
        run: |
          cp meow-rs/target/aarch64-unknown-linux-musl/release/meow \
             meow-aarch64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: meow-aarch64-unknown-linux-musl
          path: meow-aarch64-unknown-linux-musl
          if-no-files-found: error
          retention-days: 30
