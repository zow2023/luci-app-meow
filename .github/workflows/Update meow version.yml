name: Update meow version

on:
  schedule:
    - cron: '17 0 * * *'   # 每天 UTC 00:17 检查一次上游 release
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    name: Update meow core version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update meow version
        run: bash scripts/update_meow_version.sh

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change."
          else
            VERSION="$(grep '^PKG_VERSION:=' meow/Makefile | cut -d= -f2)"

            git add meow/Makefile luci-app-meow/Makefile
            git commit -m "meow: update to v${VERSION}"

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main    # 注意:与本仓库默认分支一致(honk 模板是 master,这里是 main)
