# Default meow-rs configuration shipped with the OpenWrt package.
# Edit this file, then restart the service: /etc/init.d/meow restart
# Full reference: https://github.com/madeye/meow-rs/blob/main/config.example.yaml

# Combined HTTP + SOCKS5 proxy for LAN clients.
mixed-port: 7890
allow-lan: true
bind-address: "0.0.0.0"

# Transparent gateway. The port MUST match `tproxy_port` in /etc/config/meow,
# otherwise the nft rules redirect LAN traffic to a port nobody listens on.
tproxy-port: 7893
routing-mark: 9527

mode: rule
log-level: info
ipv6: false

# REST API + built-in web panel (served at /ui). The port must match
# `panel_port` in /etc/config/meow.
external-controller: 0.0.0.0:9090
secret: ""

dns:
  enable: true
  # Must bind 0.0.0.0 (not 127.0.0.1): the nft rules DNAT LAN :53 queries
  # to the router's LAN address on this port.
  listen: 0.0.0.0:1053
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

rules:
  - MATCH,DIRECT
